<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Rhythm Captions - Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card gate-card">
        <header>
            <h1>RHYTHM <span>CAPTIONS</span></h1>
            <p>Enter secret code & details to unlock the full tool</p>
        </header>
        <form id="signupForm">
            <div class="step-block">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your name" required>
            </div>
            <div class="step-block">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="e.g. 9876543210" required>
            </div>
            <div class="step-block">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>
            <div class="step-block">
                <label>Work Status</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="workStatus" value="team" required> I work in a team
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="workStatus" value="alone" required> I work alone
                    </label>
                </div>
            </div>
            <div class="step-block">
                <label for="code">Secret Code</label>
                <input type="password" id="code" placeholder="Enter the code" required>
            </div>
            <button type="submit" class="btn btn-primary full">Unlock Rhythm Captions</button>
            <p id="errorMsg" style="color:#e1306c; font-size:0.7rem; text-align:center; margin-top:8px;"></p>
        </form>
    </div>
    <div id="customPopup" class="popup-overlay hidden">
        <div class="popup-card">
            <p id="popupMsg"></p>
            <button class="btn btn-secondary" id="closePopup">Close</button>
        </div>
    </div>
    <script src="gate.js"></script>
</body>
              </html>
