<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rhythm Captions</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <header>
            <h1>RHYTHM <span>CAPTIONS</span></h1>
            <p>Upload a song — AI detects full lyrics & syncs to beat</p>
        </header>

        <div class="step-block">
            <label>Deepgram API Key</label>
            <div class="input-row">
                <input type="password" id="apiKeyInput" placeholder="Enter your Deepgram key">
                <button id="btnToggleKey">👁</button>
            </div>
        </div>

        <div class="drop-zone" id="dropZone">
            <p>🎵 Tap to upload song</p>
            <small>MP3, M4A, WAV etc.</small>
        </div>

        <div id="controlsCard" class="hidden">
            <div style="background:#222; padding:10px; border-radius:12px; margin:10px 0;">
                <span id="fileInfo">file.mp3</span>
                <button id="btnReset" style="float:right; background:none; border:none; color:red;">×</button>
            </div>

            <button class="btn btn-primary" id="btnTranscribe" style="width:100%; margin:15px 0;">
                Detect Lyrics with AI
            </button>
        </div>

        <div id="lyricsPreviewBlock" class="hidden">
            <textarea id="lyricsEditor" rows="5" placeholder="Lyrics will appear here..."></textarea>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn btn-secondary" id="btnPreview">Preview</button>
                <button class="btn btn-primary" id="btnRender">Generate Video</button>
            </div>
        </div>

        <div id="previewBox" class="hidden">
            <canvas id="videoCanvas" width="540" height="960" style="width:100%; max-width:300px; border-radius:12px; background:black;"></canvas>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
    </html>
